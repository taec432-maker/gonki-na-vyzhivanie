name: Проверка и публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Есть ли уже проект?
        id: has
        run: |
          if [ -f package.json ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "yes=false" >> "$GITHUB_OUTPUT"; fi
      - name: Установка
        if: steps.has.outputs.yes == 'true'
        run: npm ci
      - name: Проверки (tsc, eslint, vitest)
        if: steps.has.outputs.yes == 'true'
        run: npm run check:ci --if-present
      - name: Сборка
        if: steps.has.outputs.yes == 'true'
        run: npm run build
        env:
          VITE_BASE: /gonki-na-vyzhivanie/
      - name: Заглушка до этапа 0
        if: steps.has.outputs.yes == 'false'
        run: |
          mkdir -p dist
          printf '<!doctype html><meta charset="utf-8"><title>Гонки на выживание</title><h1>Гонки на выживание</h1><p>Игра появится после этапа 0.</p>' > dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
